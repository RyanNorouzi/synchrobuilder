name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 24]
    steps:
      - name: Check out with the repository's line-ending rules (no autocrlf surprises)
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --version && git --version
      - run: node scripts/lint.mjs
      - run: node scripts/test.mjs
      - name: Site builds and passes its checks
        run: node site/build.mjs && node site/check.mjs
  crlf-checkout:
    name: test on a CRLF checkout (windows)
    runs-on: windows-latest
    steps:
      - run: git config --global core.autocrlf true
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/test.mjs
  plugin-validate:
    name: claude plugin validate --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude --version
      - run: claude plugin validate --strict plugins/synchrobuilder
      - run: claude plugin validate --strict .
